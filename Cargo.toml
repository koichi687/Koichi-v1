[package]
name = "koichi-dayO"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
dotenvy = "0.15.7"
iced = { version = "0.14.0", features = ["tokio", "image"] }
reqwest = { version = "0.13.4", features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
